# Hugo configuration.
# Docs: https://gohugo.io/getting-started/configuration/

baseURL = "https://my-blog-t3l.pages.dev/"
# `languageCode` was deprecated in Hugo 0.158; `locale` replaces it.
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "我的博客"
theme = "ananke"

# Emit an RSS feed and sitemap; Cloudflare Pages serves these as-is.
enableRobotsTXT = true

# Ananke reads these for author bylines and the footer.
[params]
  description = "记录技术，也记录生活。"
  author = "Joker"

  # Comment system.
  #
  # NOTE ON ORDER: this key must appear BEFORE the [[params.ananke_socials]]
  # array below. TOML treats `[[table]]` as opening an array of tables, and
  # every following key/value belongs to that array's last element until a new
  # table header appears. Declared after it, `commentoEnable` silently becomes
  # a field of the socials entry instead of a [params] key, so
  # `.Site.Params.commentoEnable` — the expression Ananke's single.html tests —
  # resolves to nil and the comment partial is never called.
  commentoEnable = true

  # Sort section list pages newest-first. Hugo defaults to date-desc already;
  # stating it explicitly keeps the archive order obvious.
  [params.ananke]
    [params.ananke.pages]
      show_list_images = false

  # Ananke's main menu. The theme renders these in the header.
  [[params.ananke_socials]]
    name = "github"
    url = "https://github.com/Joker4845"

  [params.ziscus]
    enabled = true
    # The deployed Worker endpoint. The generated layouts/_partials/ziscus.html
    # reads `.Site.Params.ziscus.endpoint`, so keep this key name in sync.
    endpoint = "https://ziscus-comments.gentle-math-b39e.workers.dev"

# Top navigation. Two content sections plus the archive.
[[menu.main]]
  name = "技术文章"
  pageRef = "/tech"
  weight = 10

[[menu.main]]
  name = "随笔"
  pageRef = "/essays"
  weight = 20

[[menu.main]]
  name = "归档"
  pageRef = "/archives"
  weight = 30

[[menu.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Lets you write raw HTML inside Markdown posts. Convenient, but note
      # that it also means pasted HTML from untrusted sources is rendered.
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 4

# NOTE: no custom [outputs] block on purpose. Ananke's search/lunr feature needs
# a JSON home output, but adding "JSON" without the matching layouts/index.json
# template fails the build. Add both together if you want site search later.

# Taxonomies stay at Hugo's defaults (tags, categories). Ananke shows both.
