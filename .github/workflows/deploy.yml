name: Deploy Hugo site to Cloudflare Pages

on:
  push:
    branches: [main]
  # Ziscus calls this via repository_dispatch when a comment is approved, so
  # the statically rendered comments refresh without a manual push.
  repository_dispatch:
    types: [ziscus-comment]
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ananke uses .GitInfo for "last modified" dates, which needs history.
          # No submodules: the theme is vendored into themes/ananke/ and
          # committed, so it is already present after checkout.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not "latest": a new Hugo minor release can change template
          # behaviour and break a build that was green yesterday.
          # Must stay >= 0.160.0, which is Ananke v2's minimum (theme.toml).
          # Keep in sync with the version installed locally.
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        # No `npm install` step on purpose: Ananke's CSS is self-contained and
        # builds without node_modules (verified locally by building with the
        # directory absent — identical output hash). Adding a needless install
        # would only add a failure point.
        run: hugo --minify --gc

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.BLOG_PROJECT_NAME }}
